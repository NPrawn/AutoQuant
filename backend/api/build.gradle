plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.19.4'
}

group = 'com.ssafy.a107'
version = '0.0.1-SNAPSHOT'

// 로컬 JDK 버전과 무관하게 동일하게 빌드되도록 Java 21 로 고정
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.ta4j:ta4j-core:0.22.6'

    // 인증 — SSAFY OAuth2 로그인 후 서비스 자체 JWT 를 발급한다
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // 도메인 정본 — DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // 파생 계층 — Go consumer 가 써둔 값을 읽는다 (cache 패키지)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.rest-assured:spring-mock-mvc'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openapi3 {
    server = 'http://localhost:8080'
    title = 'S15P21A107 API'
    description = '암호화폐 전략 설계·백테스트·모의투자 플랫폼 API'
    version = project.version
    format = 'yaml'
    outputFileNamePrefix = 'openapi'
    tagDescriptionsPropertiesFile = 'src/test/resources/tag-descriptions.yaml'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

afterEvaluate {
    tasks.named('openapi3') {
        dependsOn tasks.named('test')
    }

    tasks.named('build') {
        dependsOn tasks.named('openapi3')
    }
}
