spring:
  application:
    name: a107-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:a107}
    username: ${DB_USER:a107}
    password: ${DB_PASSWORD:a107}

  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션이 단독 소유한다.
      # update 로 두면 Hibernate 가 Go consumer 가 INSERT 하는 테이블을 변경한다.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:a107}
    password: ${RABBITMQ_PASSWORD:a107}

server:
  port: ${SERVER_PORT:8080}

# 요청 식별자를 모든 로그 줄에 찍는다. RequestIdFilter 가 MDC 에 넣고, 같은 값이
# X-Request-ID 헤더로 AI 서버까지 간다. 값이 없는 스레드에서는 빈칸이다.
logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{requestId:-}]"

# ai/ FastAPI 전략 추론 서비스. timeout 은 AI 서버 실측 p95 4.6초에 재시도 여유를 더한 값이다.
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  timeout: ${AI_TIMEOUT:10s}
  translations-per-minute-per-member: ${AI_TRANSLATIONS_PER_MINUTE:10}

# Upbit 공개 시세 API
upbit:
  base-url: ${UPBIT_BASE_URL:https://api.upbit.com}
  timeout: ${UPBIT_TIMEOUT:5s}

# SSAFY OAuth2 인증 서버. client-id 와 client-secret 은 기본값을 두지 않아 값이 없으면 기동이 실패한다.
ssafy:
  oauth2:
    base-url: ${SSAFY_BASE_URL:https://project.ssafy.com}
    client-id: ${SSAFY_CLIENT_ID}
    client-secret: ${SSAFY_CLIENT_SECRET}
    redirect-uri: ${SSAFY_REDIRECT_URI}
    authorize-path: ${SSAFY_AUTHORIZE_PATH:/oauth/sso-check}
    token-path: ${SSAFY_TOKEN_PATH:/ssafy/oauth2/token}
    user-info-path: ${SSAFY_USER_INFO_PATH:/ssafy/resources/userInfo}
    timeout: ${SSAFY_TIMEOUT:5s}

# 서비스 자체 액세스 토큰. secret 은 HS256 최소 길이인 32바이트 이상이어야 한다.
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:a107}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:1h}

# 로그인 완료 후 브라우저를 돌려보낼 프론트 주소와 토큰 쿠키 설정. HTTPS 배포에서는 cookie-secure 를 켠다.
auth:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}

backtest:
  execution:
    minimum-order-amount: ${BACKTEST_MINIMUM_ORDER_AMOUNT:5000}
    price-tick-size: ${BACKTEST_PRICE_TICK_SIZE:1}
    quantity-step-size: ${BACKTEST_QUANTITY_STEP_SIZE:0.00000001}
  job:
    exchange: ${BACKTEST_JOB_EXCHANGE:backtest.exchange}
    queue: ${BACKTEST_JOB_QUEUE:backtest.queue}
    routing-key: ${BACKTEST_JOB_ROUTING_KEY:backtest.run}

---

spring:
  config:
    activate:
      on-profile: backtest-worker
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
